# Autostart: NOT enabled for this deployment.
#
# ~/homelab-infra/start.sh scans $INFRA_DIR/../projects (i.e. ~/projects) for
# ".autostart" marker files and, for each one found, runs
# `docker compose -f <project>/docker-compose.yml up -d` — note it looks for
# the file named exactly "docker-compose.yml", not "docker-compose.yaml".
#
# This repo lives under ~/workspaces, which start.sh never scans. On top of
# that, ~/projects does not currently exist on this machine at all, so the
# scan step is presently skipped for every project, not just this one (see
# the "projects root ... not found, skipping autostart scan" lines in
# ~/homelab-infra/start.log). That's a pre-existing gap in the shared infra,
# out of scope for this repo to fix.
#
# To enable autostart for Artifacts once ~/projects is restored/rewired:
#   1. Get a copy of (or symlink to) this app's checkout under
#      ~/projects/artifacts.
#   2. Ensure a file named exactly docker-compose.yml exists there (rename or
#      symlink this file to that name — start.sh's find/if check is literal).
#   3. Add an empty ".autostart" marker file next to it.
#
# Until then, start/stop this service manually with `docker compose up -d` /
# `docker compose down` from this directory.

networks:
  caddy:
    external: true

services:
  artifacts:
    build: .
    restart: unless-stopped
    # Node runs as PID 1 in the container and doesn't reap/forward signals on
    # its own; without a real init, `docker stop` blocks for the full grace
    # period and gets SIGKILLed (a mid-write sqlite corruption risk). `init:
    # true` runs tini as PID 1 so SIGTERM reaches Node and it exits cleanly.
    init: true
    networks:
      - caddy
    volumes:
      # Relative to wherever this compose file's checkout lives — fine for
      # ad hoc verification from any worktree, but production should run
      # this from the stable main checkout (not a disposable worktree) so
      # ./data doesn't get orphaned when the worktree is removed.
      - ./data:/app/data
    environment:
      - ARTIFACTS_DATA_DIR=/app/data
      # Not consumed by app code yet; the MCP endpoint work will read this to
      # build resolvable artifact links (see CLAUDE.md).
      - PUBLIC_BASE_URL=https://artifacts.valhalla.local
    labels:
      caddy: artifacts.valhalla.local
      caddy.reverse_proxy: '{{upstreams 3000}}'
